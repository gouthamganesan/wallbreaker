# One-time credential setup + verify, driven on-device so secrets never touch
# the Mac's shell history or process args. Values come from MAESTRO_-prefixed
# env vars, which Maestro injects into the flow:
#   read -r  MAESTRO_INSTA_USER"?Instapaper email: "
#   read -rs MAESTRO_INSTA_PASS"?Instapaper password: "
#   export MAESTRO_INSTA_USER MAESTRO_INSTA_PASS
#   ~/.maestro/bin/maestro test .maestro/config-verify.yaml
appId: dev.goutham.wallbreaker
---
- launchApp
- tapOn: "Email"
- inputText: ${MAESTRO_INSTA_USER}
- tapOn: "Password"
- inputText: ${MAESTRO_INSTA_PASS}
- hideKeyboard
- tapOn: "Save"
- assertVisible: "Saved"
- tapOn: "Verify"
- extendedWaitUntil:
    visible: "Credentials valid"
    timeout: 15000
